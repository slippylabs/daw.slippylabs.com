<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/style.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:radial-gradient(circle at 50% 0%,#0e2a22,#050b10 65%);font-family:Consolas,monospace}
.wrap{position:relative;width:1200px;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
h1{font-family:"Press Start 2P",Consolas,monospace;font-size:56px;color:#39ff8f;text-shadow:0 0 30px rgba(57,255,143,.5);margin:0;letter-spacing:2px}
p{color:#d9fbe8;font-size:23px;margin:0;letter-spacing:1px}
.sub{color:#7fa695;font-size:18px}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:6px}
.bars i{width:20px;background:linear-gradient(180deg,#39ff8f,#1c8a52);display:block}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:900px}
.chip{border:1px solid rgba(57,255,143,.45);color:#39ff8f;font-size:15px;padding:6px 13px;letter-spacing:1px}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(57,255,143,.045),rgba(57,255,143,.045) 1px,transparent 2px,transparent 4px)}
</style></head><body>
<div class="wrap">
  <div class="bars" id="b"></div>
  <h1>SLIPDAW</h1>
  <p>A full digital audio workstation in your browser</p>
  <div class="chips">
    <span class="chip">CHANNEL RACK</span><span class="chip">PIANO ROLL</span><span class="chip">PLAYLIST</span>
    <span class="chip">MIXER</span><span class="chip">5 INSTRUMENTS</span><span class="chip">17 PLUGINS</span><span class="chip">WAV EXPORT</span>
  </div>
  <div class="sub">daw.slippylabs.com &mdash; no signup, no install</div>
  <div class="scan"></div>
</div>
<script>
// Deterministic bar heights so regenerating the image gives the same picture.
const h=[38,72,55,96,44,110,62,84,30,100,52,76,90,46,68,58,104,40,80,64,34,92,50,86];
document.getElementById('b').innerHTML=h.map(v=>`<i style="height:${v}px"></i>`).join('');
</script></body></html>
