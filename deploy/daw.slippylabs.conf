# SlipDAW is ARCHIVED (2026-10-13). SoundCraft, an open-source ArtCraft
# DAW installed by the craftsuite repo, replaced it on music.slippylabs.com.
# This block only keeps old links working; the docroot was moved to
# ~/archive/daw-www-2026-10-13.tar.gz and the vhost that served it to
# ~/archive/daw.slippylabs.conf.served-2026-10-13. The app is this repo at v1.2.3.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name daw.slippylabs.com;
    include snippets/security-headers.conf;
    include snippets/block-dotfiles.conf;

    ssl_certificate     /etc/letsencrypt/live/slippylabs-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slippylabs-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 301 https://soundcraft.slippylabs.com/;
    }
}
